name: jlab_server
channels:
  - conda-forge
dependencies:
  - conda
  - ipywidgets >= 8.0.1
  - jupyterlab 4.6.2
  - ipympl >= 0.8.2
  - matplotlib-base
  # [UAV-IDE MODIFY] Keep the bundled runtime within the FleetDock SDK production constraint.
  - numpy >=1.26,<2.4
  - pandas
  - pip
  - python 3.12*
  - scipy
platforms:
  - linux-64
  - linux-aarch64
  - osx-64
  - osx-arm64
  - win-64
