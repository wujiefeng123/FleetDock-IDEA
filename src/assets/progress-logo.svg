<svg width="360" height="300" viewBox="0 0 360 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- [UAV-IDE MODIFY] Show FleetDock IDEA as one development hub for aerial, ground, and robotic systems. -->
  <g opacity="0.78" stroke="#25658C" stroke-width="2.5" stroke-linecap="round">
    <path d="M92 68C54 93 36 136 42 178"/>
    <path d="M49 199C61 231 87 255 119 267"/>
    <path d="M142 273C171 279 202 277 229 268"/>
    <path d="M252 257C282 240 304 211 313 179"/>
    <path d="M317 154C319 122 307 91 285 68"/>
    <path d="M265 50C243 34 218 25 192 23"/>
  </g>

  <path d="M180 69V96M102 221L132 190M258 221L228 190" stroke="#6FA9C8" stroke-width="2.5"/>
  <circle cx="180" cy="96" r="5" fill="#22D3EE"/>
  <circle cx="132" cy="190" r="5" fill="#22D3EE"/>
  <circle cx="228" cy="190" r="5" fill="#22D3EE"/>

  <g filter="url(#hubShadow)">
    <path d="M180 88L238 121V187L180 220L122 187V121L180 88Z" fill="#EAF8FF" fill-opacity="0.58" stroke="#B9D7E8" stroke-width="2"/>
    <path d="M180 100L226 126V180L180 207L134 180V126L180 100Z" fill="url(#hubBody)"/>
    <path d="M134 159L180 185L226 159V180L180 207L134 180V159Z" fill="#082F52" fill-opacity="0.72"/>
    <path d="M180 108L219 131V163L180 185L141 163V131L180 108Z" fill="#123D68" stroke="#2C6D99" stroke-width="2"/>
    <circle cx="180" cy="146" r="28" stroke="#22D3EE" stroke-width="6"/>
    <path d="M180 118A28 28 0 0 1 207 139" stroke="#7DD3FC" stroke-width="6" stroke-linecap="round"/>
    <circle cx="180" cy="174" r="5" fill="#22C55E">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M143 179L180 200L217 179" stroke="#3EC3E6" stroke-width="2" opacity="0.7"/>
  </g>

  <g>
    <circle cx="180" cy="45" r="34" fill="#F8FCFF" fill-opacity="0.92" stroke="#22577A" stroke-width="2"/>
    <!-- Aerial systems -->
    <g stroke="#174A73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M171 42L160 33M189 42L200 33M171 48L160 57M189 48L200 57"/>
      <circle cx="156" cy="29" r="7"/>
      <circle cx="204" cy="29" r="7"/>
      <circle cx="156" cy="61" r="7"/>
      <circle cx="204" cy="61" r="7"/>
      <rect x="171" y="38" width="18" height="14" rx="5" fill="#174A73" stroke="none"/>
    </g>
  </g>

  <g>
    <circle cx="78" cy="231" r="36" fill="#F8FCFF" fill-opacity="0.92" stroke="#22577A" stroke-width="2"/>
    <!-- Ground systems -->
    <g stroke="#174A73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M59 228H97V244H59V228Z" fill="#174A73"/>
      <path d="M67 228L72 218H88L93 228"/>
      <path d="M80 218V209"/>
      <circle cx="80" cy="206" r="4" fill="#174A73"/>
      <circle cx="67" cy="247" r="6" fill="#F8FCFF"/>
      <circle cx="89" cy="247" r="6" fill="#F8FCFF"/>
    </g>
  </g>

  <g>
    <circle cx="282" cy="231" r="36" fill="#F8FCFF" fill-opacity="0.92" stroke="#22577A" stroke-width="2"/>
    <!-- Robotic systems -->
    <g stroke="#174A73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M265 247H299"/>
      <path d="M275 247V237L284 226L274 218L264 226"/>
      <path d="M284 226L294 214"/>
      <circle cx="274" cy="218" r="5" fill="#F8FCFF"/>
      <circle cx="284" cy="226" r="5" fill="#F8FCFF"/>
      <path d="M293 211L298 207M293 211L300 215"/>
    </g>
  </g>

  <g>
    <circle cx="316" cy="111" r="7" fill="#22D3EE" filter="url(#dotGlow)"/>
    <animateTransform attributeName="transform" type="rotate" from="0 180 150" to="360 180 150" dur="4.2s" repeatCount="indefinite"/>
  </g>

  <defs>
    <linearGradient id="hubBody" x1="144" y1="105" x2="218" y2="202" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2B6C98"/>
      <stop offset="0.52" stop-color="#0E446E"/>
      <stop offset="1" stop-color="#082F52"/>
    </linearGradient>
    <filter id="hubShadow" x="100" y="74" width="160" height="172" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.18"/>
    </filter>
    <filter id="dotGlow" x="297" y="92" width="38" height="38" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#22D3EE" flood-opacity="0.7"/>
    </filter>
  </defs>
</svg>
