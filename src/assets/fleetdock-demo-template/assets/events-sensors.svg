<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="554" viewBox="0 0 1200 554">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="554" rx="32" fill="url(#bg)"/>
  <rect x="48" y="38" width="10" height="92" rx="5" fill="#0284c7"/>
  <text x="82" y="78" fill="#0f172a" font-family="Microsoft YaHei, Segoe UI, sans-serif"
        font-size="34" font-weight="800">事件、状态与标准传感器</text>
  <text x="82" y="116" fill="#64748b" font-family="Microsoft YaHei, Segoe UI, sans-serif"
        font-size="18">厂商原始数据被转换成可复用的 FleetDock 标准模型</text>
  <g filter="url(#shadow)" font-family="Microsoft YaHei, Segoe UI, sans-serif">

      <g>
        <rect x="59" y="170" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="97" cy="208" r="20" fill="#0284c7"/>
        <text x="97" y="214" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">1</text>
        <text x="131" y="213" fill="#0f172a"
              font-size="22" font-weight="700">Events</text>
        <text x="87" y="257" fill="#475569"
              font-size="16">订阅连接、位置与任务事件</text>
      </g>

      <g>
        <rect x="435" y="170" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="473" cy="208" r="20" fill="#0284c7"/>
        <text x="473" y="214" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">2</text>
        <text x="507" y="213" fill="#0f172a"
              font-size="22" font-weight="700">State</text>
        <text x="463" y="257" fill="#475569"
              font-size="16">线程安全的最新状态快照</text>
      </g>

      <g>
        <rect x="811" y="170" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="849" cy="208" r="20" fill="#0284c7"/>
        <text x="849" y="214" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">3</text>
        <text x="883" y="213" fill="#0f172a"
              font-size="22" font-weight="700">SensorHub</text>
        <text x="839" y="257" fill="#475569"
              font-size="16">发现和选择标准传感器</text>
      </g>

      <g>
        <rect x="59" y="338" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="97" cy="376" r="20" fill="#0284c7"/>
        <text x="97" y="382" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">4</text>
        <text x="131" y="381" fill="#0f172a"
              font-size="22" font-weight="700">read_once</text>
        <text x="87" y="425" fill="#475569"
              font-size="16">一次读取一份强类型样本</text>
      </g>

      <g>
        <rect x="435" y="338" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="473" cy="376" r="20" fill="#0284c7"/>
        <text x="473" y="382" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">5</text>
        <text x="507" y="381" fill="#0f172a"
              font-size="22" font-weight="700">subscribe</text>
        <text x="463" y="425" fill="#475569"
              font-size="16">持续接收数据流</text>
      </g>

      <g>
        <rect x="811" y="338" width="330" height="126" rx="22"
              fill="#ffffff" stroke="#dbe5f2" stroke-width="2"/>
        <circle cx="849" cy="376" r="20" fill="#0284c7"/>
        <text x="849" y="382" text-anchor="middle"
              fill="#ffffff" font-size="17" font-weight="700">6</text>
        <text x="883" y="381" fill="#0f172a"
              font-size="22" font-weight="700">Debug</text>
        <text x="839" y="425" fill="#475569"
