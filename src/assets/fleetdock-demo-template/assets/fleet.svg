  <text x="82" y="116" fill="#64748b" font-family="Microsoft YaHei, Segoe UI, sans-serif"
        font-size="18">同一套标准接口同时作用于多架无人机或异构设备</text>
  <g filter="url(#shadow)" font-family="Microsoft YaHei, Segoe UI, sans-serif">

      <g>
        <rect x="59" y="170" width="330" height="126" rx="22"
